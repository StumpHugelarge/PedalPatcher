name: Build & regression test

# Runs the same build GitHub Pages will deploy, plus the committed
# Playwright regression check (tests/regression.mjs), on every push and
# pull request. The point is to catch a broken build or a broken
# interaction *before* it reaches main — deploy.yml only checks that the
# code compiles, not that the app still actually works.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
